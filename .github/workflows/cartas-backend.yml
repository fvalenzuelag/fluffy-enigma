# Workflow activo: GitHub solo ejecuta archivos bajo .github/workflows/
name: CI/CD Cartas Backend

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - ".github/workflows/cartas-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests
        working-directory: java
        run: mvn -B test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: java
        run: docker build -t cartas-app:latest .

      - name: Tag and push image
        run: |
          docker tag cartas-app:latest ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_BACKEND }}:latest

      - name: Deploy on EC2 via SSM (MySQL + app)
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_IMAGE: ${{ secrets.ECR_REPO_URL_BACKEND }}:latest
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          INSTANCE_ID: ${{ secrets.EC2_BACKEND_INSTANCE_ID }}
        run: |
          python3 << 'PY'
          import json, os, shlex

          region = os.environ["AWS_REGION"]
          reg = os.environ["ECR_REGISTRY"]
          img = os.environ["ECR_IMAGE"]
          root = shlex.quote(os.environ["MYSQL_ROOT_PASSWORD"])
          appw = shlex.quote(os.environ["MYSQL_APP_PASSWORD"])
          ds = (
              "jdbc:mysql://cartas-mysql:3306/cartasdb"
              "?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          )
          ds_q = shlex.quote(ds)

          cmds = [
              f"aws ecr get-login-password --region {shlex.quote(region)} | docker login --username AWS --password-stdin {shlex.quote(reg)}",
              "docker network create cartas-net 2>/dev/null || true",
              "docker rm -f cartas-mysql cartas-app 2>/dev/null || true",
              (
                  "docker run -d --name cartas-mysql --network cartas-net "
                  f"-e MYSQL_ROOT_PASSWORD={root} -e MYSQL_DATABASE=cartasdb "
                  f"-e MYSQL_USER=cartas -e MYSQL_PASSWORD={appw} mysql:8.0"
              ),
              "sleep 35",
              (
                  "docker run -d --name cartas-app --network cartas-net -p 8080:8080 "
                  "-e DB_USERNAME=cartas "
                  f"-e DB_PASSWORD={appw} -e SPRING_DATASOURCE_URL={ds_q} "
                  f"{shlex.quote(img)}"
              ),
          ]
          with open("ssm-params.json", "w", encoding="utf-8") as f:
              json.dump({"commands": cmds}, f)
          PY
          aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json
