spring.application.name=employees
server.port=8080

# Valores por defecto para docker-compose (host "db"). En EC2 u otro entorno, sobreescribe con variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:employeesdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:emp}
spring.datasource.password=${DB_PASSWORD:empsecret}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
