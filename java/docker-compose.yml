version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: cartas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cartasdb
      MYSQL_USER: cartas
      MYSQL_PASSWORD: cartas123
    ports:
      - "3306:3306"
    volumes:
      - cartas-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartas-app
    ports:
      - "8080:8080"
    environment:
      DB_USERNAME: cartas
      DB_PASSWORD: cartas123
    depends_on:
      db:
        condition: service_healthy

volumes:
  cartas-data:
