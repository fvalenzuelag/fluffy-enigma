spring.application.name=docker-lab-java
server.port=8080

# Por defecto: H2 en memoria (mvn spring-boot:run sin MySQL).
# Con Docker Compose, define SPRING_DATASOURCE_URL, USERNAME y PASSWORD en el servicio app.
spring.datasource.url=jdbc:h2:mem:dockerlab;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2database.Driver
