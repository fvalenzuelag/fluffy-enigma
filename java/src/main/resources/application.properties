spring.application.name=cartas
server.port=8080

# En docker-compose el servicio se llama "db". En EC2 u otro host, define SPRING_DATASOURCE_URL (p. ej. jdbc:mysql://cartas-mysql:3306/...).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/cartasdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
