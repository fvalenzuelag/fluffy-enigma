# Taller: tres servicios (un proceso por contenedor). La red por defecto de Compose
# permite que "frontend" resuelva los nombres java-backend y python-backend.
#
# Nombre del archivo: Docker Compose v2 busca primero compose.yaml / compose.yml
# en el directorio actual (y padres). Así se evita el error
# "no configuration file provided: not found" cuando falta docker-compose.yml.
#
# Nombre del proyecto: define el prefijo de contenedores, red e imágenes (antes salía
# de la carpeta, p. ej. dockerfile-devops-*). Personalízalo (minúsculas, números, guiones).

name: taller-docker

services:
  java-backend:
    build:
      context: .
      dockerfile: Dockerfile.java
    ports:
      - "8080:8080"

  python-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      JAVA_API_URL: http://java-backend:8080
      PYTHON_API_URL: http://python-backend:5000
    depends_on:
      - java-backend
      - python-backend
